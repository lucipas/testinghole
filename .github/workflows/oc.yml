name: Opencode AI Automation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for OpenCode to execute"
        required: true
        type: string
        default: "Scaffold simple html site"
      model:
        description: "Model to use, in provider/model format"
        required: false
        type: string
        default: "opencode/big-pickle"

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install latest OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Run OpenCode
        env:
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          opencode run --standalone --model "$MODEL" --auto "$PROMPT"

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected from opencode execution."
          else
            git commit -m "chore: automated update from opencode prompt"
            git push origin HEAD:main
          fi
