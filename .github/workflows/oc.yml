name: Opencode AI Automation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for Opencode to execute"
        required: true
        type: string
        default: "Scaffold simple html site"

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and checkout new feature branch
        run: |
          BRANCH_NAME="opencode/auto-patch-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b "$BRANCH_NAME"

      - name: Download and install opencode binary
        run: |
          # Replace with your actual valid release binary URL
          curl -sSL -o /usr/local/bin/opencode "https://github.com/anomalyco/opencode/releases/tag/v1.19.5/download/opencode-linux-amd64.deb"
          chmod +x /usr/local/bin/opencode
          
          # Validate that the download succeeded and isn't an HTML error page
          if head -n 1 /usr/local/bin/opencode | grep -q "<!doctype html>"; then
            echo "Error: Downloaded file is an HTML page, not a binary. Check your URL."
            exit 1
          fi

      - name: Run opencode prompt
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run --prompt "${{ inputs.prompt }}"

      - name: Commit and push changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected from opencode execution."
            echo "CHANGES_MADE=false" >> $GITHUB_ENV
          else
            git commit -m "chore: automated update from opencode prompt"
            git push origin "${{ env.BRANCH_NAME }}"
            echo "CHANGES_MADE=true" >> $GITHUB_ENV
          fi

      - name: Create Pull Request and Merge Automatically
        if: env.CHANGES_MADE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the pull request
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ env.BRANCH_NAME }}" \
            --title "Automated Opencode Changes" \
            --body "Automated PR generated from prompt: *${{ inputs.prompt }}*")
          
          echo "Created PR: $PR_URL"

          # Automatically merge the PR and delete the temporary branch
          gh pr merge "$PR_URL" --merge --delete-branch
