name: Opencode AI Automation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for OpenCode to execute"
        required: true
        type: string
        default: "Scaffold simple html site"
      model:
        description: "Model to use, in provider/model format"
        required: false
        type: string
        default: "opencode/big-pickle"

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and checkout feature branch
        run: |
          BRANCH_NAME="opencode/auto-patch-$(date +%s)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH_NAME"

      - name: Install latest OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Run OpenCode
        env:
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          opencode run --standalone --model "$MODEL" --auto "$PROMPT"

      - name: Commit and push changes
        id: commit
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected from opencode execution."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: automated update from opencode prompt"
            git push -u origin "$BRANCH_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Automated OpenCode Changes" \
            --body "$(printf 'Automated PR generated from prompt:\n\n%s\n\nThis PR should not be merged until CodeRabbit has reviewed it.' "$PROMPT")")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR: $PR_URL"

      - name: Request CodeRabbit review
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr comment "$PR_URL" --body "@coderabbitai review"
